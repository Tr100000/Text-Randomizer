license = "MIT"

modLoader="javafml"
loaderVersion="[2,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "Tr100000"
description = "Randomizes all translated text in Minecraft."

logoFile = "assets/text_randomizer/icon.png"
displayURL = "https://modrinth.com/project/text-randomizer"
issueTrackerUrl = "https://github.com/Tr100000/Text-Randomizer/issues"
updateJSONURL = "https://api.modrinth.com/updates/text-randomizer/forge_updates.json"

[[mixins]]
config = "text_randomizer.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "yet_another_config_lib_v3"
type = "optional"
ordering = "NONE"
side = "CLIENT"
